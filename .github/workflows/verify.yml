name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: mtg-deckbuilding-assistant
jobs:
  explorer-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mtg-deckbuilding-assistant/web
    steps:
      - uses: actions/checkout@v4
        with:
          path: mtg-deckbuilding-assistant
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-ui
          path: mtg-deckbuilding-assistant/generated/explorer/
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: mtg-deckbuilding-assistant
      - uses: actions/checkout@v4
        with:
          repository: jasullivan5/argentum-engine
          ref: app-stable
          path: argentum-engine
      - name: Record resolved stable revision
        run: |
          echo "Engine app-stable: $(git -C ../argentum-engine rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git -C ../argentum-engine branch --show-current
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            argentum-engine/gradle/libs.versions.toml
            mtg-deckbuilding-assistant/gradle/wrapper/gradle-wrapper.properties
            mtg-deckbuilding-assistant/build.gradle.kts
      - run: bash scripts/bootstrap.sh
      - run: python3 scripts/test-bootstrap.py
      - run: python3 scripts/test-oracle-snapshot.py
      - run: python3 scripts/test-catalog-comparison.py
      - run: ./dev test
      - name: Preserve engine provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-build-and-tests
          path: |
            mtg-deckbuilding-assistant/build/generated/engine-resources/
            mtg-deckbuilding-assistant/build/reports/tests/
