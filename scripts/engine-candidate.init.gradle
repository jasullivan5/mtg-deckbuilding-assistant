// Opt-in experiment only. The approved checkout, pin and ordinary dev wrapper remain untouched.
def appProperty = System.getProperty('mtg.assistant.root')
def candidate = System.getProperty('mtg.engine.candidate')
if (!appProperty || !(candidate ==~ /[0-9a-f]{40}/)) {
    throw new GradleException('Supply -Dmtg.assistant.root=<application> and -Dmtg.engine.candidate=<exact commit>')
}
def appRoot = new File(appProperty).canonicalFile
def engineRoot
settingsEvaluated { settings ->
    engineRoot = settings.settingsDir.canonicalFile
    if (engineRoot == new File(appRoot, 'argentum').canonicalFile) {
        throw new GradleException('Experimental integration must use a separate engine checkout')
    }
    def git = { List args ->
        def process = new ProcessBuilder(['git', '-C', engineRoot.path] + args).redirectErrorStream(true).start()
        def output = process.inputStream.getText('UTF-8').trim()
        if (process.waitFor() != 0) throw new GradleException(output)
        output
    }
    if (git(['rev-parse', 'HEAD']) != candidate || git(['status', '--porcelain'])) {
        throw new GradleException('Candidate commit must match a clean engine checkout')
    }
    def approved = new File(appRoot, 'ARGENTUM_COMMIT').text.trim()
    git(['merge-base', '--is-ancestor', approved, candidate])
    if (candidate == approved) throw new GradleException('This configuration is for an unapproved candidate only')
    println "EXPERIMENTAL ENGINE: ${candidate}; APPROVED PIN UNCHANGED: ${approved}"
    settings.include(':assistant-cli')
    settings.project(':assistant-cli').projectDir = new File(appRoot, 'cli')
}
beforeProject { project ->
    if (project.path == ':assistant-cli') {
        project.layout.buildDirectory.set(new File(engineRoot, 'build/assistant-cli'))
        project.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
            environment 'ARGENTUM_CANDIDATE_REVISION', candidate
            environment 'VERIFY_KNOWN_ENGINE_GAPS', '1'
            systemProperty 'mtg.engine.candidate', candidate
        }
    }
}
